<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinReq</title>
    <link rel="stylesheet" href="CSS/Style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .logo {
            width: 50px;
            height: auto;
        }
        main h2 {
            margin-top: 1.5rem;
        }
        footer {
            background-color: #f8f9fa;
            padding: 10px 0;
            text-align: center;
            margin-top: 30px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<header class="text-black py-3 hero-header">
    <div class="container text-center">
        <div class="d-flex align-items-center justify-content-center gap-2 mb-3">
            <img src="images/con.webp" alt="Logo" class="logo">
            <h1 class="m-0" style="color: #f8f9fa;">MinReq</h1>
        </div>
        <nav class="nav justify-content-center">
            <a href="index.html" class="nav-link text-white">Home</a>
            <a href="Forum.html" class="nav-link text-white">Forum</a>
            <a href="TopGames.html" class="nav-link text-white">Top Games</a>
            <a href="contact.html" class="nav-link text-white"><u>Contact</u></a>
        </nav>
    </div>
</header>

<main class="container my-4">

    <section class="mb-5">
        <h2>CAN’T FIND A GAME? REACH OUT TO US!</h2>
        <p>Fill out the form below and we’ll get back to you.</p>
    </section>

    <section class="mb-5">
        <form action="https://formspree.io/f/mrekovgj?redirect=Thanks.html" method="POST">

            <!-- Email textbox -->
            <div class="mb-3">
                <label for="email" class="form-label"><b>Email address</b></label>
                <input type="email" id="email" name="email" class="form-control"
                       placeholder="Enter your email" required>
            </div>

            <!-- Dropdown -->
            <div class="mb-3">
                <label for="topic" class="form-label"><b>Reason for contact</b></label>
                <select id="topic" name="topic" class="form-select" required>
                    <option value="">Select an option</option>
                    <option value="game-request">Request a game</option>
                    <option value="bug-report">Report a bug</option>
                    <option value="feedback">General feedback</option>
                </select>
            </div>

            <!-- Radio buttons -->
            <div class="mb-3">
                <label class="form-label"><b>Platform</b></label>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="platform" id="pc" value="pc" required>
                    <label class="form-check-label" for="pc">PC</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="platform" id="console" value="console">
                    <label class="form-check-label" for="console">Console</label>
                </div>
            </div>

            <!-- Checkbox -->
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="updates" name="updates">
                <label class="form-check-label" for="updates">
                    Notify me when the game is added
                </label>
            </div>

            <!-- Message textbox -->
            <div class="mb-4">
                <label for="message" class="form-label"><b>Message</b></label>
                <textarea id="message" name="message" class="form-control" rows="5"
                          placeholder="Type your message here..." required></textarea>
            </div>

            <!-- Submit button -->
            <button type="submit" class="btn btn-primary">Send Message</button>

        </form>
    </section>

</main>

<footer>
    <small>&copy; 2025 MinReq</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
